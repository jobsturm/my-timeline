steps:
- name: mikefarah/yq
  id: Update service name
  args: [ 'eval', '-i', '.service = "jobsturm-portfolio"', '/workspace/app.yaml']
- name: node:20
  id: Npm install
  entrypoint: npm
  args: ["install"]
- name: node:20
  id: NPM Run Build
  entrypoint: npm
  args: ["run", "build"]
- name: "gcr.io/cloud-builders/gcloud"
  id: Gcloud app deploy
  args: ["app", "deploy"]
timeout: "1600s"
